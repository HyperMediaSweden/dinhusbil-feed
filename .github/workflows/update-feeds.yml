name: Uppdatera feeds

on:
  schedule:
    - cron: "7 * * * *"        # varje timme (UTC), 7 min över
  workflow_dispatch:           # kan även köras manuellt under Actions-fliken

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta lager och bygg feeds
        run: python3 generate_feeds.py
      - name: Commit och push
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs
          git commit -m "Uppdaterade feeds $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Inga ändringar"
          git push
